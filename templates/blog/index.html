{% extends "base.html" %}

{% block content %}
    <h1>My Blog</h1>

    {% for post in post_list %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title"><a href="{% url 'blog:post-detail' pk=post.pk %}">{{ post.title }}</a></h5>

                <p class="card-text text-muted">Author: {{ post.author.username }} | {{ post.created_time|date:"Y-m-d" }}</p>
                <p class="card-text">{{ post.content|truncatechars:200 }}</p>
                <p class="card-text">Comments: {{ post.comments.count }}</p>

            </div>
        </div>
    {% endfor %}

    {% endblock content %}
