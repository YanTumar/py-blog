{% extends 'base.html' %}

{% block content %}
    <div class="post-detail">
        <h1>{{ post.title }}</h1>
        <p class="text-muted">Author: {{ post.owner.username }} | {{ post.created_time|date:"Y-m-d" }}</p>
        <hr>
        <p>{{ post.content|safe }}</p>
    </div>

{% endblock %}
